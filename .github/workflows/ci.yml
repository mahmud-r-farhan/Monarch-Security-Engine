name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  typecheck-and-test:
    name: Test & Typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: TypeScript Type Check
        run: npm run typecheck
      - name: Build Web Frontend Application
        run: npm run build
      - name: Execute Node.js Test Suite
        run: npm test

  lint:
    name: Code Linting & Static Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Check for unused code patterns & console leaks
        run: |
          echo "Checking for console.log leaks in core engine code..."
          ! grep -r "console\.log" src/engine/ src/modules/ --include="*.js" | grep -v "console\.error" | grep -v "console\.warn" || echo "Found console.log - consider using proper logging"
          echo "Checking for TODO/FIXME comments..."
          grep -r "TODO\|FIXME" src/ --include="*.js" --include="*.ts" || echo "No TODOs found"

  self-scan:
    name: Scan demo target (end-to-end) & SARIF artifact
    runs-on: ubuntu-latest
    needs: typecheck-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Start vulnerable demo target
        run: (npm run demo:target &) && sleep 2
      - name: Run Monarch scanner CLI against demo target
        run: |
          set +e
          node src/cli.js http://localhost:4000 --no-ai --out audit
          code=$?
          echo "exit code: $code"
          # The demo target is intentionally broken — assert we found findings (exit code 2).
          test "$code" -eq 2
      - name: Upload Audit Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-audit-sarif
          path: audit

  python-powerup:
    name: Test Python power-up service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r services/python/requirements.txt || pip install requests
      - name: Run Python scanner self-test
        run: |
          cd services/python
          python3 advanced_scanner.py --target https://example.com --format json | head -50
          echo "Python scanner OK"

  go-powerup:
    name: Test Go power-up service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build and test Go scanner
        run: |
          cd services/go
          go vet ./...
          go build -o monarch-go main.go
          ./monarch-go -target 127.0.0.1 -ports 22,80,443 -timeout 500 || true
          echo "Go scanner OK"
