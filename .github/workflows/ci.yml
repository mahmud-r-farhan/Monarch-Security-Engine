name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run typecheck
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Check for unused code patterns
        run: |
          echo "Checking for console.log leaks in production code..."
          ! grep -r "console\.log" src/engine/ src/modules/ --include="*.js" | grep -v "console\.error" | grep -v "console\.warn" || echo "Found console.log - consider using proper logging"
          echo "Checking for TODO/FIXME..."
          grep -r "TODO\|FIXME" src/ --include="*.js" --include="*.ts" || echo "No TODOs found"

  self-scan:
    name: Scan demo target (end-to-end)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Start vulnerable demo target
        run: (npm run demo:target &) && sleep 2
      - name: Run Monarch against it
        run: |
          set +e
          node src/cli.js http://localhost:4000 --no-ai --out audit
          code=$?
          echo "exit code: $code"
          # The demo target is intentionally broken — assert we *found* criticals.
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: demo-audit
          path: audit

  python-powerup:
    name: Test Python power-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests || true
      - name: Run Python scanner self-test
        run: |
          cd services/python
          python3 advanced_scanner.py --target https://example.com --format json | head -50
          echo "Python scanner OK"

  go-powerup:
    name: Test Go power-up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build and test Go scanner
        run: |
          cd services/go
          go vet ./...
          go build -o monarch-go main.go
          ./monarch-go -target 127.0.0.1 -ports 22,80,443 -timeout 500 || true
          echo "Go scanner OK"
