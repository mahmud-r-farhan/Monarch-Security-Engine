name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=optional
      - run: npm test

  self-scan:
    name: Scan demo target (end-to-end)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - name: Start vulnerable demo target
        run: (npm run demo:target &) && sleep 2
      - name: Run Monarch against it
        run: |
          set +e
          node src/cli.js http://localhost:4000 --no-ai --out audit
          code=$?
          echo "exit code: $code"
          # The demo target is intentionally broken — assert we *found* criticals.
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: demo-audit
          path: audit
