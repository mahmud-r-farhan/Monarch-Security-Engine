name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create release archives
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Creating release for $VERSION"
          tar -czf monarch-security-engine-$VERSION.tar.gz --exclude=node_modules --exclude=.git --exclude=dist --exclude=reports --exclude=audit .
          zip -r monarch-security-engine-$VERSION.zip . -x "node_modules/*" ".git/*" "dist/*" "reports/*" "audit/*"
          ls -lh monarch-*

      - name: Generate changelog
        run: |
          echo "# Release ${{ github.ref_name }}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          echo "## What's Changed" >> CHANGELOG_RELEASE.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG_RELEASE.md || echo "- Initial release" >> CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            monarch-security-engine-*.tar.gz
            monarch-security-engine-*.zip
          body_path: CHANGELOG_RELEASE.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  npm-publish:
    runs-on: ubuntu-latest
    needs: release
    if: "!contains(github.ref, '-rc') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha')"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --omit=optional
      - run: npm run build
      - name: Publish to NPM (dry-run for now)
        run: |
          echo "NPM publish would run here"
          # npm publish --provenance --access public
        continue-on-error: true
